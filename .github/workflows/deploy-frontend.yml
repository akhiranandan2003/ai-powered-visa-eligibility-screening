name: Deploy React Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my_visa_app/frontend_react/package-lock.json

      - name: Install dependencies
        working-directory: my_visa_app/frontend_react
        run: npm ci

      - name: Build React app
        working-directory: my_visa_app/frontend_react
        env:
          REACT_APP_API_URL: https://ai-visa-eligibility-screening.onrender.com
        run: npm run build

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: my_visa_app/frontend_react/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4